<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zehn Chunker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Sora', sans-serif;
    background: #0a0a0f;
    color: #e8e4f0;
    min-height: 100vh;
    padding: 32px 24px;
    max-width: 680px;
    margin: 0 auto;
  }

  .header { text-align: center; margin-bottom: 32px; }
  .logo { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: #7c5cbf; margin-bottom: 8px; }
  h1 { font-size: 26px; font-weight: 700; color: #fff; }
  h1 span { color: #9b6dff; }

  .card {
    background: #13121a;
    border: 1px solid #1e1d2a;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 16px;
  }

  .card-label {
    font-size: 10px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #6b648a;
    margin-bottom: 12px;
    font-weight: 600;
  }

  textarea {
    width: 100%;
    background: #0d0c14;
    border: 1px solid #252336;
    border-radius: 10px;
    color: #e8e4f0;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    line-height: 1.7;
    padding: 14px;
    resize: vertical;
    min-height: 160px;
    outline: none;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: #6b3fff; }

  .controls-row {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    flex-wrap: wrap;
  }

  .mode-tabs { display: flex; gap: 8px; }

  .mode-tab {
    padding: 10px 14px;
    background: #0d0c14;
    border: 1px solid #252336;
    border-radius: 8px;
    color: #6b648a;
    font-family: 'Sora', sans-serif;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .mode-tab.active { background: #1c1040; border-color: #6b3fff; color: #9b6dff; }

  .chunk-size-wrap { display: flex; flex-direction: column; gap: 6px; }
  .chunk-size-wrap label { font-size: 10px; color: #6b648a; letter-spacing: 1.5px; text-transform: uppercase; }
  .chunk-size-wrap input {
    width: 90px;
    background: #0d0c14;
    border: 1px solid #252336;
    border-radius: 8px;
    color: #e8e4f0;
    font-family: 'Sora', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  .chunk-size-wrap input:focus { border-color: #6b3fff; }

  .btn-split {
    padding: 11px 22px;
    background: linear-gradient(135deg, #6b3fff, #9b6dff);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-family: 'Sora', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
  }
  .btn-split:hover { opacity: 0.88; }

  .output-section { display: none; margin-top: 8px; }
  .output-section.visible { display: block; }

  .output-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .output-meta { font-size: 12px; color: #6b648a; }
  .output-meta span { color: #9b6dff; font-weight: 600; }

  /* Code box header bar */
  .code-box-wrap {
    background: #13121a;
    border: 1px solid #1e1d2a;
    border-radius: 14px;
    overflow: hidden;
  }

  .code-box-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: #0f0e18;
    border-bottom: 1px solid #1e1d2a;
  }

  .code-box-dots {
    display: flex;
    gap: 6px;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  .dot-r { background: #3a1a1a; }
  .dot-y { background: #2e2a10; }
  .dot-g { background: #0f2e1a; }

  .code-box-label {
    font-size: 10px;
    color: #4a3d80;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
  }

  .btn-copy-all {
    padding: 6px 16px;
    background: linear-gradient(135deg, #6b3fff, #9b6dff);
    border: none;
    border-radius: 7px;
    color: #fff;
    font-family: 'Sora', sans-serif;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
    letter-spacing: 0.3px;
  }
  .btn-copy-all:hover { opacity: 0.88; }
  .btn-copy-all.done { background: #1c1040; border: 1px solid #6b3fff; color: #9b6dff; }

  /* The actual output textarea — readonly, preserves whitespace */
  .code-output {
    width: 100%;
    background: #0d0c14;
    border: none;
    color: #e8e4f0;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    line-height: 1.9;
    padding: 20px;
    resize: none;
    outline: none;
    min-height: 300px;
    max-height: 520px;
    overflow-y: auto;
    white-space: pre;
    cursor: text;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(70px);
    background: #1c1040;
    border: 1px solid #6b3fff;
    color: #9b6dff;
    padding: 10px 22px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    transition: transform 0.3s ease;
    z-index: 999;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="header">
  <div class="logo">Zehn Studio</div>
  <h1>Script <span>Chunker</span></h1>
</div>

<div class="card">
  <div class="card-label">Paste Your Script</div>
  <textarea id="scriptInput" placeholder="Paste your Zehn lesson script here..."></textarea>
</div>

<div class="card">
  <div class="card-label">Split Settings</div>
  <div class="controls-row">
    <div class="mode-tabs">
      <div class="mode-tab active" data-mode="words" onclick="setMode('words')">Words</div>
      <div class="mode-tab" data-mode="chars" onclick="setMode('chars')">Characters</div>
      <div class="mode-tab" data-mode="sentences" onclick="setMode('sentences')">Sentences</div>
    </div>
    <div class="chunk-size-wrap" id="chunkSizeWrap">
      <label id="chunkLabel">Words per chunk</label>
      <input type="number" id="chunkSize" value="50" min="1" max="500">
    </div>
    <button class="btn-split" onclick="generateChunks()">Split</button>
  </div>
</div>

<div class="output-section" id="outputSection">
  <div class="output-top">
    <div class="output-meta">
      <span id="chunkCount">0</span> chunks &middot; <span id="wordCount">0</span> words total
    </div>
  </div>

  <div class="code-box-wrap">
    <div class="code-box-topbar">
      <div class="code-box-dots">
        <div class="dot dot-r"></div>
        <div class="dot dot-y"></div>
        <div class="dot dot-g"></div>
      </div>
      <div class="code-box-label">chunks.txt</div>
      <button class="btn-copy-all" id="copyAllBtn" onclick="copyAll()">Copy All</button>
    </div>
    <textarea class="code-output" id="codeOutput" readonly spellcheck="false"></textarea>
  </div>
</div>

<div class="toast" id="toast">Copied!</div>

<script>
  var currentMode = 'words';
  var allChunks = [];

  function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-tab').forEach(function(t) { t.classList.remove('active'); });
    document.querySelector('[data-mode="' + mode + '"]').classList.add('active');
    var wrap = document.getElementById('chunkSizeWrap');
    var label = document.getElementById('chunkLabel');
    var input = document.getElementById('chunkSize');
    if (mode === 'words') { wrap.style.display='flex'; label.textContent='Words per chunk'; input.value=50; }
    else if (mode === 'chars') { wrap.style.display='flex'; label.textContent='Characters per chunk'; input.value=300; }
    else { wrap.style.display='none'; }
  }

  function chunkText(text) {
    var chunkSize = parseInt(document.getElementById('chunkSize').value) || 50;
    if (currentMode === 'words') {
      var words = text.trim().split(/\s+/);
      var chunks = [];
      for (var i = 0; i < words.length; i += chunkSize) chunks.push(words.slice(i, i + chunkSize).join(' '));
      return chunks;
    }
    if (currentMode === 'chars') {
      var words2 = text.trim().split(/\s+/), chunks2 = [], current = '';
      for (var j = 0; j < words2.length; j++) {
        var word = words2[j];
        if (current && (current + ' ' + word).length > chunkSize) { chunks2.push(current); current = word; }
        else { current = current ? current + ' ' + word : word; }
      }
      if (current) chunks2.push(current);
      return chunks2;
    }
    if (currentMode === 'sentences') {
      var raw = text.trim().split(/(?<=[.!?])\s+/).filter(function(s) { return s.trim(); });
      return raw.length ? raw : [text.trim()];
    }
    return [text.trim()];
  }

  function generateChunks() {
    var script = document.getElementById('scriptInput').value.trim();
    if (!script) { alert('Please paste your script first.'); return; }
    allChunks = chunkText(script);
    var wordCount = script.split(/\s+/).length;

    document.getElementById('chunkCount').textContent = allChunks.length;
    document.getElementById('wordCount').textContent = wordCount;

    // Build plain text output — bare chunks separated by blank line
    document.getElementById('codeOutput').value = allChunks.join('\n\n');

    var btn = document.getElementById('copyAllBtn');
    btn.textContent = 'Copy All';
    btn.classList.remove('done');

    var out = document.getElementById('outputSection');
    out.classList.add('visible');
    out.scrollIntoView({ behavior: 'smooth' });
  }

  function copyAll() {
    // Copy just the chunk text, no separators
    var clean = allChunks.join('\n\n');
    navigator.clipboard.writeText(clean).then(function() {
      var btn = document.getElementById('copyAllBtn');
      btn.textContent = 'Copied!';
      btn.classList.add('done');
      showToast('All chunks copied!');
      setTimeout(function() { btn.textContent = 'Copy All'; btn.classList.remove('done'); }, 2500);
    });
  }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2000);
  }
</script>
</body>
</html>
